# Harbour extension CI (HW-2026-008, CCSS K-01..K-05, SLSA build L2).
# Repository settings that make this a control (not code, set them by hand):
#   - branch protection on main: require this workflow + 1 review, no force push, signed commits
#   - environment "release" with 2 required reviewers; HB_RELEASE_KEY_PEM stored only as that environment's secret
name: extension
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['harbour-wallet-v3/apps/extension/**', '.github/workflows/extension.yml']
  pull_request:
    paths: ['harbour-wallet-v3/apps/extension/**', '.github/workflows/extension.yml']
permissions: {contents: read}
defaults:
  run:
    working-directory: harbour-wallet-v3/apps/extension
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: harbour-wallet-v3/apps/extension/.nvmrc
          cache: npm
          cache-dependency-path: harbour-wallet-v3/apps/extension/package-lock.json
      - run: npm ci --ignore-scripts
      # lint, type-check, tests, production build, npm audit gate (high/critical, dated exceptions in audit-exceptions.json), secret scan
      - run: npm run verify
      - name: SBOM (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: harbour-wallet-v3/apps/extension/sbom.cdx.json}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: release   # 2 required reviewers; their logins become HB_RELEASE_APPROVERS
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: harbour-wallet-v3/apps/extension/.nvmrc
          cache: npm
          cache-dependency-path: harbour-wallet-v3/apps/extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/release.mjs
        env:
          HB_RELEASE_KEY_PEM: ${{ secrets.HB_RELEASE_KEY_PEM }}
          HB_RELEASE_APPROVERS: ${{ vars.HB_RELEASE_APPROVERS }}
      - run: node scripts/repro.mjs
      - uses: actions/attest-build-provenance@v1
        with: {subject-path: "harbour-wallet-v3/apps/extension/releases/*.zip"}
      - uses: actions/upload-artifact@v4
        with: {name: release, path: harbour-wallet-v3/apps/extension/releases/}
