# GitHub Actions workflow for harbour-wallet-v3/apps/backend.
# Actions are pinned to full commit SHAs (a tag such as @v4 can be moved to different code by whoever controls the action;
# see the tj-actions/changed-files compromise, 2025). Dependabot (github-actions) proposes the SHA bumps.
name: backend
on:
  push:
    paths: ["harbour-wallet-v3/apps/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["harbour-wallet-v3/apps/backend/**", ".github/workflows/backend.yml"]
# Least privilege: the workflow token can only read the repository (it runs `go test`, linters and `docker build` on pull-request code).
permissions: {contents: read}
defaults:
  run:
    working-directory: harbour-wallet-v3/apps/backend
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: harbour, POSTGRES_PASSWORD: harbour, POSTGRES_DB: harbour_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harbour" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: harbour-wallet-v3/apps/backend/go.mod, cache-dependency-path: harbour-wallet-v3/apps/backend/go.sum}
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with: {version: v2.5.0, working-directory: harbour-wallet-v3/apps/backend}
      - run: ./scripts/check-provider-names.sh
      - run: go test -race ./...
        env:
          HB_TEST_POSTGRES_URL: postgres://harbour:harbour@localhost:5432/harbour_test?sslmode=disable
          HB_TEST_REDIS_URL: redis://localhost:6379/15
      # Scanner versions are fixed (not @latest), so the code that runs in CI only changes through a reviewed commit.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0 && gosec -quiet ./...
  image:
    # The Railway image must keep building: compiles every binary and checks the service entrypoint picks them up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build --target local -t harbour-backend:local .
      - run: docker build -t harbour-backend:railway --build-arg SERVICE=api .
      - run: |
          rc=0; docker run --rm -e SERVICE=bogus harbour-backend:railway || rc=$?
          test "$rc" -eq 64
