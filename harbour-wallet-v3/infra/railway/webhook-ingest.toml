# Root directory: harbour-wallet-v3/apps/backend   Variables: SERVICE=webhook-ingest PORT=8082   Public domain: yes (Alchemy webhooks call it; set WEBHOOK_PUBLIC_URL to it)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
