# Root directory: harbour-wallet-v3/apps/backend   Variables: SERVICE=api PORT=8080   Public domain: yes (the extension's VITE_HB_API_URL)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
