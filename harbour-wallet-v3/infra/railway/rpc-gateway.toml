# Root directory: harbour-wallet-v3/apps/backend   Variables: SERVICE=rpc-gateway PORT=8081   Public domain: NO (private network only)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
