# Local stack. Run from backend/:  make up   (reads backend/.env)
name: harbour
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: harbour
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/setup.sh}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: [natsdata:/data]

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?run scripts/setup.sh}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?run scripts/setup.sh}
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes: ["./centrifugo/config.json:/centrifugo/config.json:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: {condition: service_healthy}

  migrate:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/migrate", "-maintain"]
    environment:
      POSTGRES_URL: postgres://harbour:${POSTGRES_PASSWORD}@postgres:5432/harbour?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  rpc-gateway:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/rpc-gateway", "-config", "/app/config"]
    env_file: [../.env]
    environment:
      GATEWAY_ADDR: ":8081"
    ports: ["127.0.0.1:8081:8081"]

  api:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/api", "-config", "/app/config"]
    env_file: [../.env]
    environment:
      API_ADDR: ":8080"
      POSTGRES_URL: postgres://harbour:${POSTGRES_PASSWORD}@postgres:5432/harbour?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RPC_GATEWAY_URL: http://rpc-gateway:8081
      NATS_URL: nats://nats:4222
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rpc-gateway: {condition: service_started}
      nats: {condition: service_started}

  indexer:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/indexer", "-config", "/app/config"]
    env_file: [../.env]
    environment:
      INDEXER_ADDR: ":8083"
      POSTGRES_URL: postgres://harbour:${POSTGRES_PASSWORD}@postgres:5432/harbour?sslmode=disable
      RPC_GATEWAY_URL: http://rpc-gateway:8081
      NATS_URL: nats://nats:4222
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rpc-gateway: {condition: service_started}
      nats: {condition: service_started}

volumes:
  pgdata: {}
  redisdata: {}
  natsdata: {}
