# Local stack. Run from backend/:  make up   (reads backend/.env)
name: harbour

# Shared, non-secret settings and connection strings (YAML anchors). Services connect to Postgres as harbour_svc
# (member of harbour_app), never as the owner, and to NATS with a password.
x-common: &common
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENABLED_CHAINS: ${ENABLED_CHAINS:-}
# NATS and Postgres logins are per service (see deploy/nats/nats.conf and POSTGRES_SERVICE_USERS on `migrate`).

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: harbour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: harbour
    # HW-2026-007: TLS on. The key is copied with postgres ownership and 0600 (Postgres refuses group/world-readable keys,
    # which bind mounts from macOS/Windows often are). Certificates: scripts/pg-certs.sh (run by scripts/setup.sh).
    entrypoint: ["bash", "-c", "[ -f /certs/server.key ] && [ -f /certs/server.crt ] || { echo 'Postgres TLS certificates missing: run backend/scripts/pg-certs.sh (or scripts/setup.sh), then make up' >&2; exit 1; }; install -o postgres -g postgres -m 600 /certs/server.key /var/lib/postgresql/server.key && install -o postgres -g postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c ssl_min_protocol_version=TLSv1.2"]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/certs/server.crt:/certs/server.crt:ro
      - ./postgres/certs/server.key:/certs/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbour"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/setup.sh}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nats:
    image: nats:2.10-alpine
    # Authentication required: without it any local process could publish forged balance, transaction and "Received"
    # push events. The monitoring port is not published.
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD:?run scripts/setup.sh}
      NATS_PW_API: ${NATS_PW_API:?run scripts/setup.sh}
      NATS_PW_INDEXER: ${NATS_PW_INDEXER:?run scripts/setup.sh}
      NATS_PW_WEBHOOK: ${NATS_PW_WEBHOOK:?run scripts/setup.sh}
      NATS_PW_PRICES: ${NATS_PW_PRICES:?run scripts/setup.sh}
      NATS_PW_TXTRACK: ${NATS_PW_TXTRACK:?run scripts/setup.sh}
      NATS_PW_REALTIME: ${NATS_PW_REALTIME:?run scripts/setup.sh}
      NATS_PW_NOTIFIER: ${NATS_PW_NOTIFIER:?run scripts/setup.sh}
    ports: ["127.0.0.1:4222:4222"]
    volumes: [natsdata:/data, "./nats/nats.conf:/etc/nats/nats.conf:ro"]

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?run scripts/setup.sh}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?run scripts/setup.sh}
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes: ["./centrifugo/config.json:/centrifugo/config.json:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      redis: {condition: service_healthy}

  # Runs as the database owner: applies migrations and creates the services' own login (POSTGRES_APP_USER), which is a
  # member of harbour_app (data access only: no DDL, no roles, no superuser).
  migrate:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/migrate", "-maintain"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      POSTGRES_URL: postgres://harbour:${POSTGRES_PASSWORD}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      POSTGRES_APP_USER: harbour_svc
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run scripts/setup.sh}
      # One login per service (each a member of harbour_app) so a leaked credential is one service's, and can be rotated on its own.
      POSTGRES_SERVICE_USERS: harbour_api:${PG_PW_API:?run scripts/setup.sh},harbour_indexer:${PG_PW_INDEXER:?run scripts/setup.sh},harbour_webhook:${PG_PW_WEBHOOK:?run scripts/setup.sh},harbour_prices:${PG_PW_PRICES:?run scripts/setup.sh},harbour_txtrack:${PG_PW_TXTRACK:?run scripts/setup.sh},harbour_notifier:${PG_PW_NOTIFIER:?run scripts/setup.sh}
    depends_on:
      postgres: {condition: service_healthy}

  # Every service gets only the secrets it uses (no shared env_file). x-common holds the non-secret settings.
  rpc-gateway:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/rpc-gateway", "-config", "/app/config"]
    environment:
      <<: *common
      GATEWAY_ADDR: ":8081"
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN:?run scripts/setup.sh}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}   # gateway + transaction simulator (risk: in providers.yaml)
      ALCHEMY_API_KEY_2: ${ALCHEMY_API_KEY_2:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      INFURA_API_SECRET: ${INFURA_API_SECRET:-}
      INFURA_API_KEY_2: ${INFURA_API_KEY_2:-}
      QUICKNODE_ETH_URL: ${QUICKNODE_ETH_URL:-}
      QUICKNODE_BASE_URL: ${QUICKNODE_BASE_URL:-}
      CHAINSTACK_ETH_URL: ${CHAINSTACK_ETH_URL:-}
      CHAINSTACK_BASE_URL: ${CHAINSTACK_BASE_URL:-}
    ports: ["127.0.0.1:8081:8081"]

  api:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/api", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      API_ADDR: ":8080"
      POSTGRES_URL: postgres://harbour_api:${PG_PW_API}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RPC_GATEWAY_URL: http://rpc-gateway:8081
      NATS_URL: nats://api:${NATS_PW_API}@nats:4222
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      ADDRESS_LINK_ENCRYPTION_KEY: ${ADDRESS_LINK_ENCRYPTION_KEY:?run scripts/setup.sh}
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      # Third-party gateway (/v1/gw): the keys live only here, never in the extension. Empty = that provider's routes answer "unavailable".
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}   # gateway + transaction simulator (risk: in providers.yaml)
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      JUP_API_KEY: ${JUP_API_KEY:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      PIMLICO_API_KEY: ${PIMLICO_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_PLAN: ${COINGECKO_PLAN:-demo}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY:-}
      CONFIG_JSON: ${CONFIG_JSON:-}
      CONFIG_SIG: ${CONFIG_SIG:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL:-ws://localhost:8000/connection/websocket}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      rpc-gateway: {condition: service_started}
      nats: {condition: service_started}

  indexer:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/indexer", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      INDEXER_ADDR: ":8083"
      POSTGRES_URL: postgres://harbour_indexer:${PG_PW_INDEXER}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      RPC_GATEWAY_URL: http://rpc-gateway:8081
      NATS_URL: nats://indexer:${NATS_PW_INDEXER}@nats:4222
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
      ADDRESS_LINK_ENCRYPTION_KEY: ${ADDRESS_LINK_ENCRYPTION_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}   # gateway + transaction simulator (risk: in providers.yaml)
      ALCHEMY_NOTIFY_TOKEN: ${ALCHEMY_NOTIFY_TOKEN:-}
      ALCHEMY_WEBHOOK_SIGNING_KEYS: ${ALCHEMY_WEBHOOK_SIGNING_KEYS:-}
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-}
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      rpc-gateway: {condition: service_started}
      nats: {condition: service_started}

  webhook-ingest:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/webhook-ingest", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      WEBHOOK_ADDR: ":8082"
      POSTGRES_URL: postgres://harbour_webhook:${PG_PW_WEBHOOK}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      NATS_URL: nats://webhook:${NATS_PW_WEBHOOK}@nats:4222
      ADDRESS_LINK_ENCRYPTION_KEY: ${ADDRESS_LINK_ENCRYPTION_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}        # the source adapter is built to verify deliveries
      ALCHEMY_WEBHOOK_SIGNING_KEYS: ${ALCHEMY_WEBHOOK_SIGNING_KEYS:-}
    # cloudflared (or ngrok) on your Mac forwards the public URL to this port.
    ports: ["127.0.0.1:8082:8082"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_started}

  price-poller:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/price-poller", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      POSTGRES_URL: postgres://harbour_prices:${PG_PW_PRICES}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NATS_URL: nats://prices:${NATS_PW_PRICES}@nats:4222
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_PLAN: ${COINGECKO_PLAN:-demo}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}   # gateway + transaction simulator (risk: in providers.yaml)
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      nats: {condition: service_started}

  tx-tracker:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/tx-tracker", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      POSTGRES_URL: postgres://harbour_txtrack:${PG_PW_TXTRACK}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      RPC_GATEWAY_URL: http://rpc-gateway:8081
      NATS_URL: nats://txtrack:${NATS_PW_TXTRACK}@nats:4222
      GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
    depends_on:
      migrate: {condition: service_completed_successfully}
      rpc-gateway: {condition: service_started}
      nats: {condition: service_started}

  realtime-bridge:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/realtime-bridge"]
    environment:
      <<: *common
      NATS_URL: nats://realtime:${NATS_PW_REALTIME}@nats:4222
      CENTRIFUGO_API_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
    depends_on:
      centrifugo: {condition: service_started}
      nats: {condition: service_started}

  notifier:
    build: {context: .., dockerfile: Dockerfile}
    command: ["/app/bin/notifier", "-config", "/app/config"]
    volumes: ["./postgres/certs/ca.crt:/certs/ca.crt:ro"]
    environment:
      <<: *common
      POSTGRES_URL: postgres://harbour_notifier:${PG_PW_NOTIFIER}@postgres:5432/harbour?sslmode=verify-full&sslrootcert=/certs/ca.crt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NATS_URL: nats://notifier:${NATS_PW_NOTIFIER}@nats:4222
      ADDRESS_LINK_ENCRYPTION_KEY: ${ADDRESS_LINK_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      nats: {condition: service_started}

volumes:
  pgdata: {}
  redisdata: {}
  natsdata: {}
