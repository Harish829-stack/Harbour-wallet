# NATS server config (audit V3-17). One login per service; each may publish only the subjects it owns, plus the JetStream calls the
# HARBOUR stream needs (create/update/info the stream, create/read durable consumers, ack). Nobody but the admin login can delete or
# purge the stream or publish arbitrary subjects. Passwords come from the container environment (docker-compose.yml).
#   "harbour" = admin, for host-side tools only (the port is bound to 127.0.0.1).
jetstream { store_dir: "/data" }
authorization {
  users = [
    { user: "harbour", password: $NATS_PASSWORD }
    { user: "api", password: $NATS_PW_API, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>", "address.added", "address.history.more", "tx.status.>"], subscribe: ["_INBOX.>"] } }
    { user: "indexer", password: $NATS_PW_INDEXER, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>", "activity.new.>", "balance.changed.>"], subscribe: ["_INBOX.>"] } }
    { user: "webhook", password: $NATS_PW_WEBHOOK, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>", "chain.>"], subscribe: ["_INBOX.>"] } }
    { user: "prices", password: $NATS_PW_PRICES, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>", "price.tick"], subscribe: ["_INBOX.>"] } }
    { user: "txtrack", password: $NATS_PW_TXTRACK, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>", "tx.status.>"], subscribe: ["_INBOX.>"] } }
    { user: "realtime", password: $NATS_PW_REALTIME, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>"], subscribe: ["_INBOX.>"] } }
    { user: "notifier", password: $NATS_PW_NOTIFIER, permissions: { publish: ["$JS.API.STREAM.CREATE.HARBOUR", "$JS.API.STREAM.UPDATE.HARBOUR", "$JS.API.STREAM.INFO.HARBOUR", "$JS.API.CONSUMER.CREATE.HARBOUR.>", "$JS.API.CONSUMER.DURABLE.CREATE.HARBOUR.>", "$JS.API.CONSUMER.INFO.HARBOUR.>", "$JS.API.CONSUMER.MSG.NEXT.HARBOUR.>", "$JS.ACK.HARBOUR.>"], subscribe: ["_INBOX.>"] } }
  ]
}
