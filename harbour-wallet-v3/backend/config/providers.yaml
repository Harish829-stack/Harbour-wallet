# RPC providers. Keys are referenced by env var name only; values come from
# backend/.env locally or the secret store in production. A key whose env var
# is empty is skipped at startup (logged), so optional providers cost nothing.
providers:
  alchemy:
    adapter: alchemy
    url_template: "https://{network}.g.alchemy.com/v2/{key}"
    timeout: 10s
    keys:
      - {id: alchemy-a, key_env: ALCHEMY_API_KEY,   rps: 25}
      - {id: alchemy-b, key_env: ALCHEMY_API_KEY_2, rps: 25}
  infura:
    adapter: infura
    url_template: "https://{network}.infura.io/v3/{key}"
    timeout: 10s
    keys:
      - {id: infura-a, key_env: INFURA_API_KEY,   secret_env: INFURA_API_SECRET, rps: 10}
      - {id: infura-b, key_env: INFURA_API_KEY_2, rps: 10}
  quicknode:
    adapter: url
    keys:
      - id: quicknode
        rps: 15
        url_env: {ethereum: QUICKNODE_ETH_URL, base: QUICKNODE_BASE_URL}
  chainstack:
    adapter: url
    keys:
      - id: chainstack
        rps: 15
        url_env: {ethereum: CHAINSTACK_ETH_URL, base: CHAINSTACK_BASE_URL}

# Indexer sources (index.Source adapters). Per-chain options live in chains.yaml.
sources:
  alchemy:
    adapter: alchemy
    options:
      key_env: ALCHEMY_API_KEY     # Transfers, token-balance discovery and NFT APIs
      notify_token_env: ALCHEMY_NOTIFY_TOKEN           # webhooks API (create, add/remove addresses)
      signing_keys_env: ALCHEMY_WEBHOOK_SIGNING_KEYS   # only for webhooks made by hand: "id:key,id:key"
      rps: "10"                    # this source's own budget, separate from the gateway's

# Price sources in priority order: a token missing from the first is asked
# of the next. Prices are polled for held tokens only, never per request.
price_sources:
  - name: coingecko
    adapter: coingecko
    options:
      key_env: COINGECKO_API_KEY
      plan_env: COINGECKO_PLAN      # demo | pro (pro uses the paid host)
      rps: "0.4"                    # demo allows 30 calls/min
  - name: alchemy
    adapter: alchemy-prices
    options:
      key_env: ALCHEMY_API_KEY
      rps: "5"

prices:
  top_every: 60s            # tokens held by the most addresses
  top_n: 2000
  tail_every: 5m            # everything else held
  min_liquidity_usd: 10000  # below this (24h volume or pool reserves) the UI shows "no price"
  cache_ttl: 15m            # Redis entry lifetime; stale prices disappear rather than linger

# Indexer limits (phase 3).
indexer:
  backfill_max_age: 2160h          # 90 days
  backfill_max_transfers: 5000     # per address and chain, whichever comes first
  older_page_transfers: 1000       # per on-demand page past the cap
  refresh_debounce: 2s             # balance refresh per address
  idle_sweep_after: 24h            # daily balance sweep for idle addresses
  nft_max_pages: 10                # 100 NFTs per page
  workers: 4                       # concurrent backfills

# rpc-gateway tuning; all optional (defaults in internal/config).
gateway:
  cache_max_entries: 100000
  window_size: 200          # samples kept per upstream for scoring
  window_age: 60s
  breaker_error_rate: 0.5
  breaker_min_samples: 10
  breaker_cooldown: 30s
  breaker_probes: 3
  hedge_min: 50ms           # hedge delay = upstream p90, clamped to [min, max]
  hedge_max: 2s
  max_attempts: 4           # upstreams tried per request before giving up
  budget_wait: 250ms        # wait for a token when every upstream is at budget
  sticky_ttl: 60s           # X-HB-Session pins a call sequence to one upstream
  max_batch: 100
  broadcast_fanout: 2       # eth_sendRawTransaction goes to this many upstreams
  head_poll_min: 4s         # head polls every max(block_time, this); finalized every 30s
