# Chains Harbour serves. Adding an EVM chain is one entry here; a new family
# also needs adapters under adapters/chains/<family> and adapters/sources/<name>.
# Upstreams are in priority order; weight defaults to priority if omitted.
# Testnets have no "prices:" block: their tokens show "no price".
chains:
  ethereum:
    family: evm
    evm_chain_id: 1
    block_time: 12s
    logs_max_range: 2000
    finality:
      policy: finalized-tag
    native: {symbol: ETH, decimals: 18, price_ids: {coingecko: ethereum, alchemy: ETH}}
    upstreams:
      - {provider: alchemy,    key: alchemy-a,  network: eth-mainnet, weight: 4}
      - {provider: infura,     key: infura-a,   network: mainnet,     weight: 3}
      - {provider: alchemy,    key: alchemy-b,  network: eth-mainnet, weight: 2}
      - {provider: infura,     key: infura-b,   network: mainnet,     weight: 2}
      - {provider: quicknode,  key: quicknode,                        weight: 2}
      - {provider: chainstack, key: chainstack,                       weight: 1}
    sources:
      alchemy: {network: eth-mainnet, webhook_network: ETH_MAINNET, categories: "external,internal,erc20,erc721,erc1155"}
    prices:
      coingecko: {platform: ethereum, onchain_network: eth}
      alchemy: {network: eth-mainnet}
    risk:
      alchemy-simulate: {network: eth-mainnet}
  base:
    family: evm
    evm_chain_id: 8453
    block_time: 2s
    logs_max_range: 2000
    finality:
      policy: finalized-tag   # L1 batch finality; can take 10+ minutes
    native: {symbol: ETH, decimals: 18, price_ids: {coingecko: ethereum, alchemy: ETH}}
    upstreams:
      - {provider: alchemy,    key: alchemy-a,  network: base-mainnet, weight: 4}
      - {provider: infura,     key: infura-a,   network: base-mainnet, weight: 3}
      - {provider: alchemy,    key: alchemy-b,  network: base-mainnet, weight: 2}
      - {provider: infura,     key: infura-b,   network: base-mainnet, weight: 2}
      - {provider: quicknode,  key: quicknode,                         weight: 2}
      - {provider: chainstack, key: chainstack,                        weight: 1}
    sources:
      alchemy: {network: base-mainnet, webhook_network: BASE_MAINNET, categories: "external,internal,erc20,erc721,erc1155"}
    prices:
      coingecko: {platform: base, onchain_network: base}
      alchemy: {network: base-mainnet}
    risk:
      alchemy-simulate: {network: base-mainnet}
  sepolia:
    family: evm
    evm_chain_id: 11155111
    testnet: true
    block_time: 12s
    finality: {policy: finalized-tag}
    native: {symbol: ETH, decimals: 18}
    upstreams:
      - {provider: alchemy, key: alchemy-a, network: eth-sepolia}
      - {provider: infura,  key: infura-a,  network: sepolia}
    sources:
      alchemy: {network: eth-sepolia, webhook_network: ETH_SEPOLIA, categories: "external,erc20,erc721,erc1155"}
  base-sepolia:
    family: evm
    evm_chain_id: 84532
    testnet: true
    block_time: 2s
    finality: {policy: finalized-tag}
    native: {symbol: ETH, decimals: 18}
    upstreams:
      - {provider: alchemy, key: alchemy-a, network: base-sepolia}
      - {provider: infura,  key: infura-a,  network: base-sepolia}
    sources:
      alchemy: {network: base-sepolia, webhook_network: BASE_SEPOLIA, categories: "external,erc20,erc721,erc1155"}
