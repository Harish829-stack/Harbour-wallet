# GitHub Actions workflow for harbour-wallet-v3/backend.
# Copy to <repo root>/.github/workflows/backend.yml (GitHub only reads it there).
name: backend
on:
  push:
    paths: ["harbour-wallet-v3/backend/**"]
  pull_request:
    paths: ["harbour-wallet-v3/backend/**"]
defaults:
  run:
    working-directory: harbour-wallet-v3/backend
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: harbour, POSTGRES_PASSWORD: harbour, POSTGRES_DB: harbour_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U harbour" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24", cache-dependency-path: harbour-wallet-v3/backend/go.sum}
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.5.0, working-directory: harbour-wallet-v3/backend}
      - run: ./scripts/check-provider-names.sh
      - run: go test -race ./...
        env:
          HB_TEST_POSTGRES_URL: postgres://harbour:harbour@localhost:5432/harbour_test?sslmode=disable
          HB_TEST_REDIS_URL: redis://localhost:6379/15
